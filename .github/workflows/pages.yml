# Builds the AI Studio source and publishes it to GitHub Pages.
# The only file you need to add to the repo. No other changes required.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # AI Studio pins esbuild ^0.25 but Vite 8 needs ^0.27/^0.28 as a peer.
      # The flag avoids editing a file AI Studio rewrites.
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      # --base=./ because project pages live at /<repo>/ rather than /.
      - name: Build
        run: npx vite build --base=./

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
